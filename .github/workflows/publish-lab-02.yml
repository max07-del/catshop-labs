name: publish-lab-02

on:
  push:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]
  pull_request:
    paths: ["lab-02/**", ".github/workflows/publish-lab-02.yml"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/catshop-lab-02
  TAG: sha-${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab-02/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t $IMAGE:$TAG lab-02
          docker save $IMAGE:$TAG -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push $IMAGE:$TAG
      - run: |
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:$TAG)
          echo "$DIGEST"
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "\`$DIGEST\`" >> $GITHUB_STEP_SUMMARY